[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.139.2",
    "greenlet>=3.5.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pyright]
typeCheckingMode = "standard"

[tool.ruff.format]
preview = true

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
